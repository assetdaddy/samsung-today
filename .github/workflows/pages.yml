name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/divination-app-typmqo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          # 정적 앱만 배포 (개발용 파일 제외)
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'server' --exclude 'node_modules' \
            --exclude '*.md' \
            ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
